<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Vermilion Seal Gradient -->
    <linearGradient id="vermilionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8503A" />
      <stop offset="50%" stop-color="#D94A3A" />
      <stop offset="100%" stop-color="#B83224" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#E8CCA0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D94A3A" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Noto+Serif+JP:wght@600;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap');

    .bg-rect { fill: url(#darkBg); }
    .seal-box { fill: url(#vermilionGrad); filter: url(#subtleGlow); }
    .seal-inner { stroke: #F4F0E8; stroke-width: 2.5; stroke-opacity: 0.45; fill: none; }
    .kanji-seal { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif; font-size: 88px; font-weight: 900; fill: #F4F0E8; text-anchor: middle; dominant-baseline: central; }
    .motto-text { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.55em; fill: #C5A880; }
    .brand-title { font-family: 'Cinzel', 'Trajan Pro', 'Helvetica Neue', Arial, sans-serif; font-size: 110px; font-weight: 900; letter-spacing: 0.32em; fill: #F4F0E8; }
    .subtitle-text { font-family: 'Space Mono', 'Courier New', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.35em; fill: #9E9AA0; }
    .gold-accent { fill: #C5A880; }
    .gold-line { stroke: url(#goldGrad); stroke-width: 1.5; stroke-opacity: 0.6; }
    .frame-border { stroke: #232228; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="380" rx="16" class="bg-rect" />
  
  <!-- Archival Outer Frame -->
  <rect x="20" y="20" width="1160" height="340" rx="10" class="frame-border" />
  <rect x="26" y="26" width="1148" height="328" rx="8" stroke="#C5A880" stroke-width="0.8" stroke-opacity="0.18" fill="none" />

  <!-- Corner Brackets -->
  <path d="M 20 45 L 20 20 L 45 20" stroke="#C5A880" stroke-width="2" fill="none" />
  <path d="M 1180 45 L 1180 20 L 1155 20" stroke="#C5A880" stroke-width="2" fill="none" />
  <path d="M 20 335 L 20 360 L 45 360" stroke="#C5A880" stroke-width="2" fill="none" />
  <path d="M 1180 335 L 1180 360 L 1155 360" stroke="#C5A880" stroke-width="2" fill="none" />

  <!-- LEFT: ICONIC JAPANESE VERMILION HANKO SEAL (回路) -->
  <g transform="translate(85, 90)">
    <rect width="200" height="200" rx="20" class="seal-box" />
    <rect x="10" y="10" width="180" height="180" rx="14" stroke="#F4F0E8" stroke-width="1.2" stroke-opacity="0.25" fill="none" />
    <rect x="16" y="16" width="168" height="168" rx="10" class="seal-inner" />
    <circle cx="28" cy="28" r="2.5" fill="#F4F0E8" opacity="0.6" />
    <circle cx="172" cy="28" r="2.5" fill="#F4F0E8" opacity="0.6" />
    <circle cx="28" cy="172" r="2.5" fill="#F4F0E8" opacity="0.6" />
    <circle cx="172" cy="172" r="2.5" fill="#F4F0E8" opacity="0.6" />
    <text x="100" y="102" class="kanji-seal">回路</text>
    <text x="100" y="172" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.28em" fill="#F4F0E8" opacity="0.7" text-anchor="middle">KAIRO SEAL</text>
  </g>

  <!-- Vertical Divider Separator -->
  <line x1="335" y1="80" x2="335" y2="300" stroke="#2D2B33" stroke-width="1.5" />
  <line x1="337" y1="120" x2="337" y2="260" stroke="#C5A880" stroke-width="1" stroke-opacity="0.35" />

  <!-- RIGHT: EDITORIAL TYPOGRAPHY & MOTTO -->
  <g transform="translate(380, 0)">
    <!-- TOP LINE: Japanese Archival Motto -->
    <g transform="translate(0, 115)">
      <line x1="0" y1="-5" x2="60" y2="-5" class="gold-line" />
      <text x="75" y="0" class="motto-text">精神と物質の回路</text>
      <line x1="295" y1="-5" x2="680" y2="-5" class="gold-line" />
      <circle cx="295" cy="-5" r="2" fill="#C5A880" />
    </g>

    <!-- CENTER BRAND: KAIRO -->
    <g transform="translate(0, 218)">
      <text x="0" y="0" class="brand-title">KAIRO</text>
    </g>

    <!-- BOTTOM STRIP: Subtitle and Architecture Info -->
    <g transform="translate(4, 275)">
      <text x="0" y="0" class="subtitle-text">EDITORIAL MANGA ARCHIVE</text>
      <text x="365" y="-1" class="gold-accent" font-size="12">◆</text>
      <text x="390" y="0" class="subtitle-text" fill="#C5A880">TOKYO // CAIRO</text>
      <text x="565" y="-1" class="gold-accent" font-size="12">◆</text>
      <text x="590" y="0" class="subtitle-text">EST. 2026</text>
    </g>

    <!-- Fine Bottom Gold Underline -->
    <line x1="0" y1="298" x2="720" y2="298" stroke="#232228" stroke-width="1.5" />
    <line x1="0" y1="298" x2="220" y2="298" stroke="#C5A880" stroke-width="1.5" stroke-opacity="0.7" />
  </g>
</svg>
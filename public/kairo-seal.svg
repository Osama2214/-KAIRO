<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="sealVermilion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8503A" />
      <stop offset="50%" stop-color="#D94A3A" />
      <stop offset="100%" stop-color="#B83224" />
    </linearGradient>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#D94A3A" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&amp;family=Space+Mono:wght@700&amp;display=swap');
    .kanji { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif; font-size: 200px; font-weight: 900; fill: #F4F0E8; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.35em; fill: #C5A880; text-anchor: middle; }
  </style>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="40" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="32" stroke="#232228" stroke-width="2" fill="none" />
  <rect x="20" y="20" width="472" height="472" rx="26" stroke="#C5A880" stroke-width="1" stroke-opacity="0.2" fill="none" />

  <!-- Corner Gold Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#C5A880" stroke-width="2.5" fill="none" />
  <path d="M 492 50 L 492 20 L 462 20" stroke="#C5A880" stroke-width="2.5" fill="none" />
  <path d="M 20 462 L 20 492 L 50 492" stroke="#C5A880" stroke-width="2.5" fill="none" />
  <path d="M 492 462 L 492 492 L 462 492" stroke="#C5A880" stroke-width="2.5" fill="none" />

  <!-- The Vermilion Lacquer Seal -->
  <rect x="76" y="66" width="360" height="360" rx="36" fill="url(#sealVermilion)" filter="url(#sealGlow)" />
  <rect x="94" y="84" width="324" height="324" rx="26" stroke="#F4F0E8" stroke-width="2" stroke-opacity="0.3" fill="none" />
  <rect x="104" y="94" width="304" height="304" rx="20" stroke="#F4F0E8" stroke-width="3" stroke-opacity="0.55" fill="none" />

  <!-- Corner Pins -->
  <circle cx="122" cy="112" r="4" fill="#F4F0E8" opacity="0.6" />
  <circle cx="390" cy="112" r="4" fill="#F4F0E8" opacity="0.6" />
  <circle cx="122" cy="380" r="4" fill="#F4F0E8" opacity="0.6" />
  <circle cx="390" cy="380" r="4" fill="#F4F0E8" opacity="0.6" />

  <!-- Big Kanji: 回路 -->
  <text x="256" y="244" class="kanji">回路</text>

  <!-- Seal Bottom Caption -->
  <text x="256" y="372" class="sub" fill="#F4F0E8" opacity="0.8">KAIRO ARCHIVE</text>

  <!-- Bottom Archival Code -->
  <text x="256" y="468" class="sub">精神と物質の回路 // EST. 2026</text>
</svg>